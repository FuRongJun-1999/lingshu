# 灵枢 CI · 测试基建（快/慢双档）
#
# 快档（push / PR）：跳过两个重件 test_hex_search（上游实测 361.6s）与
#   test_hex_hier（上游实测 657.5s），全量其余测试件几分钟内完成；
# 慢档（每周定时 / 手动）：全量测试件，含两个重件的理论稿回归。
#
# 已知红：test_hex_text 两项已按 intake v0.2 §五 标 xfail(strict=True)——
# 上游同跑同红、读数逐位相同；修好后 XPASS→FAIL 提醒摘牌。套件默认应全绿。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC 慢档全量
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  fast:
    name: fast (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（轻核 + full extras + dev）
        run: pip install -e ".[full,dev]"
      - name: 快档测试（重件 search/hier 除外）
        run: python -m pytest tests/ -v -rs
          --ignore=tests/test_hex_search.py
          --ignore=tests/test_hex_hier.py

  slow:
    name: slow (ubuntu, py3.12 · 全量含重件)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（轻核 + full extras + dev）
        run: pip install -e ".[full,dev]"
      - name: 全量测试（含 test_hex_search ≈6min / test_hex_hier ≈11min）
        run: python -m pytest tests/ -v -rs
