[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lingshu"
version = "0.0.1"
description = "灵枢 · 完整 AI 生命载体（灵×脑×身）——身体侧代码主体：存算一体 / 世界模型 / 自研神经网络 / 图像生成"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# 轻核承诺：core 纯标准库（不装任何 extras 也可运行）
# 版本区间依据＝2026-10-08 实测矩阵（Python 3.12.x：numpy 2.3.5/2.4.2/2.5.3 · Pillow 12.2.0/12.3.0），
# 区间外未测不承诺；矩阵与说明见 README「代码主体」节（外部报告 issue #4）。
# PyYAML 依据＝2026-10-09 实测 6.0.3（Windows/3.12）：`tools/coggraph/export_coggraph.py` 需要它，
# 而 gate 的 pytest 腿会**实跑该工具**（tests/test_coggraph_public_paths.py 逐件调用它）。
world = ["numpy>=2.3.5,<2.6"]
nn = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
gen = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
full = ["numpy>=2.3.5,<2.6", "Pillow>=12.2,<13"]
dev = ["pytest", "PyYAML>=6.0.3,<7"]

[tool.setuptools.packages.find]
include = ["lingshu*"]

[tool.setuptools.package-data]
# nn 模块附属固化物（白箱固化产物，JSON 可直读；见 docs/intake/body-export-v0.2/）
"lingshu.nn" = ["assets/*.json"]
